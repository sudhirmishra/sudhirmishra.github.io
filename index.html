<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudhir Mishra</title>
    <meta name="description" content="Static portfolio website for Sudhir Mishra">
    <meta property="og:title" content="Sudhir Mishra">
    <meta property="og:description" content="Static portfolio website for Sudhir Mishra">
    <link rel="icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #f8fafc;
            --surface-card: #ffffff;
            --text-primary: #0f172a;
            --text-muted: #64748b;
            --border-subtle: #e2e8f0;
            --accent: #2563eb;
            --accent-subtle: #eff6ff;
            --accent-border: #bfdbfe;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .portfolio-card {
            background-color: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 48px 40px;
            text-align: center;
            box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background-color: var(--accent-subtle);
            border: 1px solid var(--accent-border);
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 0.02em;
            margin-bottom: 24px;
            white-space: nowrap;
        }

        .badge-dot {
            width: 7px;
            height: 7px;
            background-color: var(--accent);
            border-radius: 50%;
            display: inline-block;
        }

        .headline {
            font-family: 'Syne', sans-serif;
            font-size: clamp(2.5rem, 6vw, 3.5rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.1;
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        .description {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-muted);
            max-width: 48ch;
            margin: 0 auto 32px;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .contact-link {
            display: inline-flex;
            align-items: center;
            padding: 12px 24px;
            background-color: var(--text-primary);
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.2s ease;
            white-space: nowrap;
        }

        .contact-link:hover {
            background-color: #1e293b;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 640px) {
            .portfolio-card {
                padding: 36px 24px;
            }
        }
    </style>
</head>
<body id="page-body">
    <main class="container" id="main-container">
        <article class="portfolio-card" id="portfolio-card">
            <div class="badge" id="status-badge">
                <span class="badge-dot" id="badge-dot"></span>
                <span>Static Portfolio</span>
            </div>
            <h1 class="headline" id="main-headline">Hello, World!</h1>
            <p class="description" id="portfolio-desc">
                Welcome to Sudhir Mishra's static portfolio website. Fast, lightweight, and completely serverless.
            </p>
            <div class="actions" id="action-links">
                <a href="mailto:sudhirxps@gmail.com" class="contact-link" id="contact-button">Get in touch</a>
            </div>
        </article>
    </main>
</body>
</html>
